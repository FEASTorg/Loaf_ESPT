schema_version: "1.0"

# ── Identity ──────────────────────────────────────────────────────────────────
id: "loaf-espt"
name: "ESP32 Thing Plus Controller Loaf"
status: "prototype"
role: "controller"

summary: "Controller Loaf carrying a SparkFun ESP32 Thing Plus, chaining onto a backplane."
description: >
  Provides the controller interface for a BREAD: hosts an ESP32 Thing Plus, steps
  the 12V bus down to 5V, and drives the Slice I2C bus through an accelerator. It
  has no Slice slots of its own -- it chains onto a backplane Loaf such as x004.

# ── Versioning ────────────────────────────────────────────────────────────────
version:
  hardware: "0.2.0"
  firmware: null
  manifest: "0.1.0"

# ── Compatibility ─────────────────────────────────────────────────────────────
compatibility:
  loaf_spec: ">=0.1.0 <0.2.0"
  slice_spec: ">=0.1.0 <0.2.0"
  crumbs_protocol: ">=0.12.0 <1.0.0"

# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  controller:
    type: "dev-board-socket"
    form_factor: "thing-plus"
    primary: "ESP32-WROOM-32E"
    supported:
      - "ESP32-WROOM-32E"
  primary_ic:
    manufacturer: "Analog Devices"
    part_number: "LTC4311ISC6-TRMPBF" # I2C bus accelerator
  hw_gen_current: 2
  hw_gen_supported: [1, 2]
  pcb:
    layers: 2
    thickness: "1.6mm"
    copper_weight: "1oz"
    dimensions: "122mm x 150mm"
  connectors:
    - ref: "J1"
      type: "slice-bus-10pin"
      purpose: "power-and-i2c"
  mounting:
    pattern: "loaf-standard-v0"
    hole_size: "M3"
    inset: "5mm"
  pcb_color_prototype: "blue"
  pcb_color_production: "green"
  enclosure:
    supported: false
    path: null

# ── Electrical ────────────────────────────────────────────────────────────────
electrical:
  input_voltage: "12V"
  logic_voltage: "3.3V"
  max_current: null
  rails:
    - name: "+5V"
      voltage: "5V"
      max_current: null
      source: "AP63205WU-7 buck from +12V"
  protection:
    reverse_polarity: false
    input_esd: false
    fuse: false

# ── Interconnect ──────────────────────────────────────────────────────────────
# No Slice slots: this Loaf provides the controller interface and chains onto a
# backplane, which is where Slices actually attach.
interconnect:
  slice_slots: 0
  bus:
    type: "i2c"
    connector: "slice-bus-10pin"
    signals:
      - "+12V"
      - "GND"
      - "SDA"
      - "SCL"
  chaining:
    supported: true
    connector: "1x10-2.54mm"

# ── Firmware ──────────────────────────────────────────────────────────────────
firmware:
  required: true
  path: "firmware/"
  language: "c++"
  framework: "arduino"
  targets:
    - "esp32_thing_plus"
  lib_deps: []

# ── Artifacts ─────────────────────────────────────────────────────────────────
artifacts:
  schematic: "hardware/BREAD_Loaf.kicad_sch"
  pcb: "hardware/BREAD_Loaf.kicad_pcb"
  firmware: "firmware/"
  docs: "docs/"
  bom: null
  gerbers: null
  pick_and_place: null
  datasheets: []

# ── Manufacturing ─────────────────────────────────────────────────────────────
manufacturing:
  assembly_type: "manual"
  preferred_fab: null
  dnp_parts: []
  critical_parts: []
  substitutions_allowed: true

# ── Validation ────────────────────────────────────────────────────────────────
validation:
  status: "not_validated"
  tested_revisions: []
  tests:
    electrical: false
    firmware: false
    integration: false
  known_issues: []

# ── Safety ────────────────────────────────────────────────────────────────────
safety:
  hazards: []
  max_safe_voltage: "12V"
  intended_environment: "lab"
  not_for:
    - "human safety critical systems"

# ── Relations ─────────────────────────────────────────────────────────────────
related:
  supersedes: null
  superseded_by: null
  variants: []
  compatible_loaves:
    - "loaf-x004"
  compatible_slices: []

# ── Maintainers ───────────────────────────────────────────────────────────────
maintainers:
  - name: "Cameron Brooks"
    role: "owner"

# ── License ───────────────────────────────────────────────────────────────────
license:
  hardware: "CERN-OHL-S-2.0"
  firmware: "GPL-3.0-or-later"
  software: "GPL-3.0-or-later"
  docs: "CC-BY-4.0"

# ── Repository ────────────────────────────────────────────────────────────────
repository:
  url: "https://github.com/feastorg/Loaf_ESPT"

# ── Metadata ──────────────────────────────────────────────────────────────────
metadata:
  created: "2024-09-30"
  updated: "2026-07-13"
  tags:
    - "controller"
    - "esp32"
    - "thing-plus"
    - "i2c"
